            bun run typecheck
            if ($LASTEXITCODE) { throw 'Starter typecheck failed.' }
          } finally { Pop-Location }
      - name: Execute real bilateral domain cases
        run: ./scripts/hf-ui06-visual.ps1 -Suite domain -CaseSet complete-75
      - name: Verify complete-75 source pairs, provenance and cleanup; preserve summary on failure
