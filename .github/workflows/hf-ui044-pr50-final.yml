      - name: Execute exactly fifteen official gates with owned runner PostgreSQL
        run: |
          node scripts/hf-ui044-pr50-contract.mjs --runner
          if ($LASTEXITCODE) { throw 'RC runner environment attestation failed.' }
          $runnerEnvironment=Get-Content -Raw .accounts-validation/hf-ui044-runner-environment.json | ConvertFrom-Json
