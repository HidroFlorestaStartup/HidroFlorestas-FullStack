          path: |
            fullstack/.accounts-validation/hf-ui044-runner-environment.json
            fullstack/.accounts-validation/ui06-b-complete-75/*.png
            fullstack/.accounts-validation/ui06-b-complete-75/*.json
            fullstack/.accounts-validation/ui06-b-complete-75/*.jsonl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  rc-final:
    if: >-
      github.repository == 'HidroFlorestaStartup/HidroFlorestas-FullStack' &&
