name: HF UI044 close synthetic evidence
on:
  push:
    branches: [codex/hf-ui044-close-20261101]
permissions:
  contents: read
concurrency:
  group: hf-ui044-close-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    if: >-
      github.repository == 'HidroFlorestaStartup/HidroFlorestas-FullStack' &&
      github.ref == 'refs/heads/codex/hf-ui044-close-20261101' &&
      github.event_name == 'push' && github.event.forced == false &&
      github.event.deleted == false && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
        working-directory: fullstack
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HF_REVERSE_GEOCODER_URL: ''
      NEXT_PUBLIC_MAP_TILE_URL: 'https://127.0.0.1:1/{z}/{x}/{y}.png'
      NEXT_PUBLIC_MAP_ATTRIBUTION: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: fullstack
          fetch-depth: 2
          persist-credentials: false
      - name: Verify branch, containment and synthetic-only environment
        run: |
          $ErrorActionPreference='Stop'
          $config=Get-Content -Raw vercel.json | ConvertFrom-Json
          if ($config.git.deploymentEnabled.'codex/hf-ui044-close-20261101' -cne $false) { throw 'Preview guard absent.' }
          if (@(Get-ChildItem -Force -File -Filter '.env*' | Where-Object Name -NotLike '*.example').Count -or (Test-Path '.vercel')) { throw 'Private configuration prohibited.' }
          foreach ($name in @('DATABASE_URL','TEST_DATABASE_URL','JWT_SECRET','SMTP_HOST','SMTP_USER','SMTP_APP_PASSWORD','MAIL_FROM','CLOUDINARY_URL','CLOUDINARY_API_KEY','CLOUDINARY_API_SECRET')) {
            if (Test-Path "Env:$name") { throw "Inherited application/provider configuration prohibited: $name" }
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: fullstack/package-lock.json
      - name: Install locked dependencies and Chromium
        run: |
          $ErrorActionPreference='Stop'
          if ((node --version).Trim() -ne 'v24.19.0') { throw 'Wrong runner Node.' }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Locked installation failed.' }
          npx playwright install chromium
          if ($LASTEXITCODE) { throw 'Chromium install failed.' }
      - name: Execute synthetic browser proof without database
        run: |
          $env:HF_UI044_SUITE='smoke'
          npx playwright test --config=qa/hf-ui044/playwright.smoke.config.ts
          if ($LASTEXITCODE) { throw 'Instrument smoke failed.' }
      - name: Archive allowlisted synthetic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: hf-ui044-smoke-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            fullstack/.accounts-validation/ui06-smoke/*.png
            fullstack/.accounts-validation/ui06-smoke/*.json
            fullstack/.accounts-validation/ui06-smoke/*.jsonl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  ui-a:
